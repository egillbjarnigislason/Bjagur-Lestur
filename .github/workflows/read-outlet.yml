name: Read outlet

# Reads the queued ('pending') articles of ONE outlet. Normally started by
# "Check feeds"; you can also run it by hand from the Actions tab.
on:
  workflow_call:
    inputs:
      outlet:
        description: "visir | mbl | ruv"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      outlet:
        description: "Outlet to read"
        type: choice
        required: true
        options: [visir, mbl, ruv]
      limit:
        description: "Max articles (blank = value from filters.yml)"
        type: string
        required: false
      dry_run:
        description: "Fetch and log only, write nothing to the database"
        type: boolean
        default: false
      backfill:
        description: "Fill new metadata columns on old rows instead of reading new ones"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One read per outlet at a time, so slow runs never overlap and double-fetch.
    concurrency:
      group: read-${{ inputs.outlet }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read ${{ inputs.outlet }}
        run: |
          args=()
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$BACKFILL" = "true" ] && args+=(--backfill)
          python -u -m bjagur.read_outlet "$OUTLET" "${args[@]}"
        env:
          PYTHONUNBUFFERED: "1"
          OUTLET: ${{ inputs.outlet }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL: ${{ inputs.backfill }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
